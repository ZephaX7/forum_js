<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion - BMW Community</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="auth-container">
  <a href="/" class="back-link">← Retour à l'accueil</a>
  <div class="auth-form">
    <h1>Connexion</h1>
    <form id="login-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="votre@email.com" required>
        <div class="error-message" id="email-error"></div>
      </div>

      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" name="password" placeholder="Votre mot de passe" required>
        <div class="error-message" id="password-error"></div>
      </div>

      <div class="error-message" id="form-error"></div>
      <div class="success-message" id="form-success"></div>

      <button type="submit" class="submit-btn">Se connecter</button>
    </form>

    <div class="auth-link">
      Pas encore inscrit? <a href="/register">Créer un compte</a>
    </div>
  </div>
</div>

<script>
  document.getElementById('login-form').addEventListener('submit', function(e) {
    e.preventDefault();

    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    document.getElementById('form-error').style.display = 'none';
    document.getElementById('form-success').style.display = 'none';

    fetch('/api/login', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        email: email,
        password: password
      })
    })
    .then(response => {
      if (!response.ok) {
        return response.text().then(text => {
          throw new Error(text);
        });
      }
      return response.json();
    })
    .then(user => {
      localStorage.setItem('user', JSON.stringify(user));
      
      const successMsg = document.getElementById('form-success');
      successMsg.textContent = 'Connexion réussie! Redirection...';
      successMsg.style.display = 'block';

      setTimeout(() => {
        window.location.href = '/forum';
      }, 1500);
    })
    .catch(error => {
      const errorMsg = document.getElementById('form-error');
      errorMsg.textContent = error.message || 'Email ou mot de passe incorrect';
      errorMsg.style.display = 'block';
    });
  });
</script>

</body>
</html>
